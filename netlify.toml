[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Same-origin API proxy — browser calls /backend/* so auth cookies are first-party.
# Next.js already owns /api/* (resume, chat, templates); do not overwrite that path.
[[redirects]]
  from = "/backend/*"
  to = "https://api.devora21.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/bg.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
